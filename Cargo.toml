[package]
name = "zentorrent"
version = "0.4.1"
edition = "2021"
description = "ZenTorrent — a small desktop BitTorrent client (egui + librqbit) with a Linux-ISO catalog, folder picker and progress bars."
license = "MIT OR Apache-2.0"

[dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.41"
ed25519-dalek = "2.2"
blake3 = "1"
hex = "0.4"
self-replace = "1"
regex = "1"
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
