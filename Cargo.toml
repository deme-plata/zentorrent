[package]
name = "zentorrent"
version = "0.8.5"
edition = "2021"
description = "ZenTorrent: a fast, ad-free desktop BitTorrent client (egui + librqbit) with a faceted sidebar, RSS/Torznab feeds, ratio ledger and signed updates."
license = "MIT OR Apache-2.0"

[dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.41"
ed25519-dalek = "2.2"
blake3 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1"
anyhow = "1"
url = "2"
# The player opens libmpv at run time (no link-time dependency, no LGPL crate).
libloading = "0.8"
dirs = "6"
# VPN: vendored IronTunnel v1 client (src/tunnel/, scripts/vendor-irontunnel.sh)
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# librqbit 9.0.1 with one added getter (TorrentStateLive::ratelimits) so the
# Details panel can change a torrent's speed limits while it runs.
# See vendor/README-zentorrent.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
